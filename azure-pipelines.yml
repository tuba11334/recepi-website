# CI/CD pipeline: install deps, build Docker image, push to ACR, deploy to AKS

trigger:
- master

pool:
  vmImage: ubuntu-latest

variables:
  imageName: 'recipe-app'
  acrName: 'tubarecipeacr'
  acrLoginServer: '$(acrName).azurecr.io'
  k8sNamespace: 'default'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- script: |
    npm install
  displayName: 'Install dependencies'

# --- Build & push Docker image to Azure Container Registry ---
- task: Docker@2
  displayName: 'Build and push image to ACR'
  inputs:
    containerRegistry: 'acr-service-connection'   # set up in Azure DevOps > Service Connections
    repository: '$(imageName)'
    command: 'buildAndPush'
    Dockerfile: '**/Dockerfile'
    tags: |
      $(Build.BuildId)
      latest

# --- Deploy to AKS ---
- task: KubernetesManifest@1
  displayName: 'Deploy to AKS'
  inputs:
    action: 'deploy'
    kubernetesServiceConnection: 'aks-service-connection'  # set up in Azure DevOps > Service Connections
    namespace: '$(k8sNamespace)'
    manifests: |
      deployment.yaml
      service.yaml
    containers: '$(acrLoginServer)/$(imageName):$(Build.BuildId)'